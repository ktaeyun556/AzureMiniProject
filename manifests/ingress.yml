apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: was-ingress
  annotations:
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: azure-application-gateway
  tls:
  - hosts:
    - api.tyaz.cloud
    secretName: api-cert-tls-secret # k8s 시크릿 이름
  rules:
  - host: api.tyaz.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spring-app-service # was service
            port:
              number: 8090 # was service port