name: WAS Image Build and Push to ACR(Subject 4 - ACA)

on:
  push:
    branches:
      - master
    paths:
      - 'board-api/**'
      - '.github/workflows/sub4-ACA.yml'

# OIDC 인증을 위해 id-token 권한이 반드시 필요
permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: "sub4-aca"
  ACA_NAME: "ca-sub4-aca"
  # ACR_NAME: "sub4aca-g5g0ezf8e5daejcw"

jobs:
  login-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure 로그인 (OIDC 방식 - EntraID 앱 등록 후 OIDC 페더레이션 자격증명 설정 필요)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }} # 등록된 앱의 클라이언트ID
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} # 앱에 구독에 대한 reader 역할 추가 필요

      # ACR 로그인
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET_FOR_ACR_LOGIN }} # 앱에 ACR 로그인에 사용할 토큰 필요(클라이언트 시크릿)
      
      # 이미지 빌드 환경 준비
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 이미지 빌드 후 ACR 푸쉬(앱에 ACR에 대한 AcrPush 역할 필요)
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./board-api
          file: ./board-api/Dockerfile
          push: true
          tags: ${{ secrets.ACR_NAME }}/was:${{ github.sha }}, ${{ secrets.ACR_NAME }}/was:latest
      
      # ACR 컨테이너 이미지를 사용해 컨테이너 앱 배포
      # - name: Deploy to Container Apps
      #   uses: azure/container-apps-deploy-action@v1
      #   with:
      #     acrName: ${{ env.ACR_NAME }}
      #     containerAppName: ${{ env.ACA_NAME }}
      #     resourceGroup: ${{ env.RESOURCE_GROUP }}
      #     imageToDeploy: ${{ secrets.ACR_NAME }}/was:${{ github.sha }}

      # ACR 컨테이너 이미지를 사용해 컨테이너 앱 배포(Azure CLI)
      - name: Deploy to Container Apps (via CLI)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.ACA_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_NAME }}/was:${{ github.sha }}